<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <title>Broyler Farm - Бройлер товуқлари учун ем озуқаси</title>
  <meta name="description" content="Ўзбекистонда бройлер товуқлари учун ем озуқаси ишлаб чиқарувчи" />

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="/img/Favicon Broyler.png" />

  <!-- Theme Color -->
  <meta name="theme-color" content="#000" />

  <!-- Styles -->
  <link rel="stylesheet" href="/css/main.min.css" />
  <link rel="stylesheet" href="/libs/swiper/swiper.css" />
</head>
<body>
  <div id="app"></div>

  <!-- jQuery (for legacy code) -->
  <script src="/libs/jquery/dist/jquery.min.js"></script>

  <!-- Swiper -->
  <script src="/libs/swiper/swiper.js"></script>

  <!-- Roistat Analytics -->
  <script>
    (function(w, d, s, h, id) {
      w.roistatProjectId = id;
      w.roistatHost = h;
      var p = d.location.protocol == "https:" ? "https://" : "http://";
      var u = /^.*roistat_visit=[^;]+(.*)?$/.test(d.cookie) ? "/dist/module.js" : "/api/site/1.0/" + id + "/init?referrer=" + encodeURIComponent(d.location.href);
      var js = d.createElement(s);
      js.charset = "UTF-8";
      js.async = 1;
      js.src = p + h + u;
      var js2 = d.getElementsByTagName(s)[0];
      js2.parentNode.insertBefore(js, js2);
    })(window, document, 'script', 'cloud.roistat.com', 'a6f3ee2f8a4ea24df0f67905bd3dc2c4');
  </script>

  <!-- Main Application -->
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
